spring.application.name=remy-backend
server.port=8080

# In-memory H2 database as a placeholder until the team picks a real one.
spring.datasource.url=jdbc:h2:mem:remy
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Let Hibernate create the schema before data.sql inserts seed rows into it.
spring.jpa.defer-datasource-initialization=true
