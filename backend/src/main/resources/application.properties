spring.application.name=remy-backend
server.port=8080
server.compression.enabled=true
server.compression.min-response-size=1024

# Origins allowed to call the API (comma-separated). Add the frontend's
# LAN address here to test from another device, e.g.:
# app.cors.allowed-origins=http://localhost:5173,http://192.168.1.23:5173
app.cors.allowed-origins=http://localhost:5173

# Database settings are in application.yml.

# Usernames promoted to ADMIN at startup (comma-separated). Registration never
# grants ADMIN, so this is how the first admin is made. Leave empty for none.
app.admin.usernames=${APP_ADMIN_USERNAMES:}
