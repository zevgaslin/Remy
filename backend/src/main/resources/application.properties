spring.application.name=remy-backend
server.port=8080

# Origins allowed to call the API (comma-separated). Add the frontend's
# LAN address here to test from another device, e.g.:
# app.cors.allowed-origins=http://localhost:5173,http://192.168.1.23:5173
app.cors.allowed-origins=http://localhost:5173

# File-based H2 database as a placeholder until the team picks a real one.
# Data persists across restarts in backend/data/remy.mv.db (gitignored).
spring.datasource.url=jdbc:h2:file:./data/remy
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Let Hibernate create the schema before data.sql inserts seed rows into it.
spring.jpa.defer-datasource-initialization=true

# File-based H2 isn't auto-detected as "embedded", so data.sql wouldn't
# run without this (it's guarded with WHERE NOT EXISTS, so this is safe
# to run on every startup).
spring.sql.init.mode=always
